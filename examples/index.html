<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="../icon/favicon.png" />
        <title>glspinner</title>
        <style type="text/css">
            canvas {
                width: 800px;
                height: 800px;
                border: 5px dotted orangered;
            }
        </style>
        <script>
            (function () {
                if (window.parent === window) return; // iframe埋め込み時のみ動作
                const post = (level, args) => {
                    try {
                        window.parent.postMessage(
                            { source: 'glspinner-preview', level, args: args.map(String), time: Date.now() },
                            '*'
                        );
                    } catch (e) {}
                };
                ['log', 'warn', 'error', 'info'].forEach((level) => {
                    const original = console[level];
                    console[level] = function (...args) {
                        post(level, args);
                        original.apply(console, args);
                    };
                });
                window.addEventListener('error', (e) => post('error', [`${e.message} (${e.filename}:${e.lineno})`]));
                window.addEventListener('unhandledrejection', (e) => post('error', [`Unhandled rejection: ${e.reason}`]));
            })();
        </script>
    </head>
    <script type="module" src="sample.ts"></script>
    <body>
        <canvas id="webgl-canvas" width="800" height="800"></canvas>
    </body>
</html>
